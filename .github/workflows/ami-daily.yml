
name: AMI Daily Automation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-search:
    runs-on: ubuntu-latest

    steps:
      - name: Download AMI
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search Avito
        env:
          AVITO_API_KEY: ${{ secrets.AVITO_API_KEY }}
        run: python ami_daily.py

      - name: Save search results
        uses: actions/upload-artifact@v4
        with:
          name: ami-avito-search
          path: ami-search-test.json
          retention-days: 7
