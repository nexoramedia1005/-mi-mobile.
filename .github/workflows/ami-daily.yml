
name: AMI Daily Automation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-search:
    runs-on: ubuntu-latest

    steps:
      - name: Download AMI
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search Avito
        env:
          AVITO_API_KEY: ${{ secrets.AVITO_API_KEY }}
        run: python ami_daily.py

      - name: Save results and market history
        run: |
          mkdir -p data
          cp ami-search-public.json data/avito-results.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/avito-results.json data/market-history.json

          if git diff --cached --quiet; then
            echo "No new data to save"
          else
            git commit -m "Update AMI market database and history"
            git push
          fi

      - name: Save backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ami-avito-search
          path: |
            ami-search-test.json
            ami-search-public.json
          retention-days: 7
